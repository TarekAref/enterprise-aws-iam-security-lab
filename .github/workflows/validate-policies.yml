name: Validate IAM JSON

on:
  push:
    paths:
      - '**/*.json'
      - 'scripts/validate-json.py'
  pull_request:
    paths:
      - '**/*.json'
      - 'scripts/validate-json.py'

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON syntax
        run: python scripts/validate-json.py
